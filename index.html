<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>物品與鑰匙借還登記系統</title>
  
  <!-- iPad 全螢幕支援 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- 自訂樣式表 -->
  <link rel="stylesheet" href="style.css" />

  <!-- 外部必要核心庫 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
</head>
<body>

  <!-- 頂部導航列 -->
  <header class="app-header">
    <div class="header-left">
      <div class="status-dot"></div>
      <h1>物品 / 鑰匙登記系統</h1>
    </div>
    
    <div class="header-right">
      <!-- 提示音量調整 -->
      <div class="volume-box">
        <label for="beep-volume">提示音量</label>
        <input id="beep-volume" type="range" min="0" max="1" step="0.05" value="0.5" />
      </div>

      <!-- 分頁切換 -->
      <nav class="tab-nav">
        <button id="nav-borrow" class="tab-btn active">借用登記</button>
        <button id="nav-return" class="tab-btn">歸還清單</button>
      </nav>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="main-container">
    
    <!-- 分頁 1：借用登記表單 -->
    <div id="page-borrow" class="page-view flex-row">
      
      <!-- 左側：掃描與物品代碼 -->
      <section class="card left-pane">
        <div>
          <div class="card-header">
            <h2>1. 物品條碼掃描</h2>
            <button id="btn-toggle-scanner" class="btn-sm">切換鏡頭</button>
          </div>

          <!-- 鏡頭預覽區 -->
          <div id="qr-reader" class="scanner-box"></div>

          <div class="form-group-stack">
            <div class="form-field">
              <label>物品代碼 / 條碼編號</label>
              <input id="borrow-item-code" type="text" placeholder="點擊掃描或手動輸入" class="input-mono" />
            </div>
            
            <div class="form-row-2">
              <div class="form-field">
                <label>物品品名</label>
                <input id="borrow-item-name" type="text" placeholder="例: 筆電充電車 / 鑰匙" />
              </div>
              <div class="form-field">
                <label>借出數量</label>
                <input id="borrow-quantity" type="number" min="1" value="1" />
              </div>
            </div>
          </div>
        </div>

        <div class="tip-text">對準物品條碼即可自動讀取並播放嗶聲</div>
      </section>

      <!-- 右側：借用人資訊與簽名 -->
      <section class="card right-pane">
        <div class="form-group-stack">
          <h2>2. 借用人身分資料</h2>

          <!-- 身分切換按鈕 -->
          <div class="role-switch">
            <button id="role-btn-student" type="button" class="role-btn active">學生登記</button>
            <button id="role-btn-staff" type="button" class="role-btn">教職員登記</button>
          </div>

          <!-- 學生容器 (預設顯示) -->
          <div id="container-student" class="form-row-3">
            <div class="form-field">
              <label>班級</label>
              <input id="borrow-class" type="text" placeholder="例: 801" />
            </div>
            <div class="form-field">
              <label>座號</label>
              <input id="borrow-seat" type="number" placeholder="例: 15" />
            </div>
            <div class="form-field">
              <label>借用人姓名</label>
              <input id="borrow-name-student" type="text" placeholder="學生全名" />
            </div>
          </div>

          <!-- 教職員容器 (預設隱藏) -->
          <div id="container-staff" class="form-row-2 is-hidden">
            <div class="form-field">
              <label>處室 / 科別</label>
              <select id="borrow-dept">
                <option value="教務處">教務處</option>
                <option value="學務處">學務處</option>
                <option value="總務處">總務處</option>
                <option value="輔導室">輔導室</option>
                <option value="圖書館">圖書館</option>
                <option value="專科教室">專科教室</option>
                <option value="其他">其他</option>
              </select>
            </div>
            <div class="form-field">
              <label>教師 / 職員姓名</label>
              <input id="borrow-name-staff" type="text" placeholder="教職員全名" />
            </div>
          </div>

          <!-- 借用用途 -->
          <div class="form-field">
            <label>借用用途說明 (選填)</label>
            <input id="borrow-purpose" type="text" placeholder="例: 自然分組實驗 / 資訊培訓" />
          </div>

          <!-- 借用電子簽名 -->
          <div class="form-field">
            <div class="sign-header">
              <label>借用人手寫簽名</label>
              <button id="btn-clear-signature" type="button" class="btn-text-danger">清除簽名</button>
            </div>
            <div class="canvas-wrapper">
              <canvas id="canvas-borrow-sign" class="signature-canvas"></canvas>
            </div>
          </div>
        </div>

        <button id="btn-submit-borrow" class="btn-primary">送出借用登記</button>
      </section>

    </div>

    <!-- 分頁 2：歸還清單 (預設隱藏) -->
    <div id="page-return" class="page-view card is-hidden">
      <div class="list-header">
        <div>
          <h2>借出中物品清單</h2>
          <span class="sub-text">點選該項進行簽名歸還確認</span>
        </div>
        <button id="btn-refresh-list" class="btn-sm">重新整理</button>
      </div>

      <div class="table-container">
        <table class="data-table">
          <thead>
            <tr>
              <th>借出時間</th>
              <th>品名代碼</th>
              <th>借用人</th>
              <th>身分單位</th>
              <th>數量</th>
              <th style="text-align: right;">操作</th>
            </tr>
          </thead>
          <tbody id="unreturned-tbody">
            <!-- 動態插入 -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- 歸還簽名 Modal 彈窗 -->
  <div id="modal-return" class="modal-backdrop is-hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3>確認歸還物品</h3>
        <button id="btn-close-modal" class="modal-close">&times;</button>
      </div>

      <div id="modal-item-info" class="modal-info"></div>

      <div class="form-field">
        <label>歸還人姓名</label>
        <input id="return-person-name" type="text" placeholder="請填寫歸還人姓名" />
      </div>

      <div class="form-field">
        <label>歸還備註說明</label>
        <input id="return-notes" type="text" placeholder="選填 (例: 物品完整無缺損)" />
      </div>

      <div class="form-field">
        <div class="sign-header">
          <label>歸還確認手寫簽名</label>
          <button id="btn-clear-return-signature" type="button" class="btn-text-danger">清除簽名</button>
        </div>
        <div class="canvas-wrapper">
          <canvas id="canvas-return-sign" class="signature-canvas"></canvas>
        </div>
      </div>

      <div class="modal-actions">
        <button id="btn-cancel-return" class="btn-secondary">取消</button>
        <button id="btn-confirm-return" class="btn-success">確認歸還存檔</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
